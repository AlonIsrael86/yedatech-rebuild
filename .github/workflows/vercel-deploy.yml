# Deploys the English homepage branch to Vercel with the Vercel CLI and points
# yedatech-english.vercel.app at the result.
#
# Every push to english-homepage-v2 builds a PREVIEW deployment, then moves the
# ALIAS_DOMAIN alias onto it. Nothing here deploys to production, so the Vercel
# project's production domain (yedatech-rebuild.vercel.app, the Hebrew
# checkpoint) is never touched.
#
# Vercel's own Git integration can only be connected by the repository owner,
# which is why deployment runs here instead.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN       Vercel access token (Account Settings -> Tokens)
#   VERCEL_ORG_ID      team ID of the Vercel project
#   VERCEL_PROJECT_ID  project ID of the Vercel project
#
# Until all three exist, the deploy job is skipped with a warning.

name: Deploy English site to Vercel

on:
  push:
    branches: [english-homepage-v2]
  workflow_dispatch:

# Only the newest push deploys; an older run still going is cancelled.
concurrency:
  group: vercel-english
  cancel-in-progress: true

permissions:
  contents: read

env:
  ENGLISH_BRANCH: english-homepage-v2
  ALIAS_DOMAIN: yedatech-english.vercel.app

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - name: Check Vercel secrets
        id: secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Vercel deploy skipped: add VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID as repository secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    # A manual run started from another branch must not take over the alias.
    if: needs.check.outputs.ready == 'true' && github.ref_name == 'english-homepage-v2'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy preview
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Point the alias at the new deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          vercel alias set "$DEPLOYMENT_URL" "$ALIAS_DOMAIN" --token="$VERCEL_TOKEN"
          {
            echo "### Deployed $ENGLISH_BRANCH"
            echo
            echo "- Live: https://$ALIAS_DOMAIN"
            echo "- This deployment: $DEPLOYMENT_URL"
          } >> "$GITHUB_STEP_SUMMARY"
